# Aurelia Data Platform - local stack
#
# Services:
#   postgres-dwh       Gold layer warehouse (loads warehouse/ddl/*.sql on first boot)
#   postgres-airflow   Airflow metadata database
#   minio              S3-compatible object storage (bronze/silver layers)
#   minio-init         One-shot job that creates the bronze/silver/gold buckets
#   blacklist-api      FastAPI mock of the external /v1/blacklist endpoint
#   airflow-init       One-shot job: airflow db migrate + admin user
#   airflow-webserver  Airflow UI on http://localhost:8080 (admin/admin)
#   airflow-scheduler  Runs the DAG (Spark jobs are executed in-process here)
#
# Before the first run:  cp .env.example .env
# Bring the stack up:    docker compose up --build
# Tear it down:          docker compose down          (keeps volumes)
#                        docker compose down -v       (wipes volumes too)

name: aurelia

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: aurelia/airflow:local
  environment: &airflow-env
    # ---- Airflow core ----
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_AIRFLOW_USER:-airflow}:${POSTGRES_AIRFLOW_PASSWORD:-airflow}@postgres-airflow:5432/${POSTGRES_AIRFLOW_DB:-airflow}
    # Let DAG code import from /opt/airflow/{spark,scripts,expectations,warehouse}
    PYTHONPATH: /opt/airflow
    # ---- Aurelia app env (consumed by Spark jobs and DAG tasks) ----
    POSTGRES_DWH_HOST: postgres-dwh
    POSTGRES_DWH_PORT: "5432"
    POSTGRES_DWH_USER: ${POSTGRES_DWH_USER:-aurelia}
    POSTGRES_DWH_PASSWORD: ${POSTGRES_DWH_PASSWORD:-aurelia}
    POSTGRES_DWH_DB: ${POSTGRES_DWH_DB:-aurelia_dwh}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE:-bronze}
    MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER:-silver}
    MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD:-gold}
    BLACKLIST_API_URL: ${BLACKLIST_API_URL:-http://blacklist-api:8000/v1/blacklist}
    SPARK_MASTER: ${SPARK_MASTER:-local[*]}
    # ---- Kafka (streaming track) ----
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS:-aurelia.events}
    KAFKA_CHECKPOINT_DIR: ${KAFKA_CHECKPOINT_DIR:-/opt/airflow/checkpoints/events_stream}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
    - ./spark:/opt/airflow/spark
    - ./scripts:/opt/airflow/scripts
    - ./expectations:/opt/airflow/expectations
    - ./warehouse:/opt/airflow/warehouse
    - ./data:/opt/airflow/data
    # Mounted so `pytest /opt/airflow/tests` inside the scheduler works.
    - ./tests:/opt/airflow/tests
    - ./blacklist_api:/opt/airflow/blacklist_api
    # Persistent checkpoint dir for Spark Structured Streaming.
    - spark-checkpoints:/opt/airflow/checkpoints
  user: "${AIRFLOW_UID:-50000}:0"

services:

  postgres-dwh:
    image: postgres:15-alpine
    container_name: aurelia-postgres-dwh
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_DWH_USER:-aurelia}
      POSTGRES_PASSWORD: ${POSTGRES_DWH_PASSWORD:-aurelia}
      POSTGRES_DB: ${POSTGRES_DWH_DB:-aurelia_dwh}
    volumes:
      - postgres-dwh-data:/var/lib/postgresql/data
      # Every *.sql file in this dir is executed once on first boot.
      - ./warehouse/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DWH_USER:-aurelia} -d ${POSTGRES_DWH_DB:-aurelia_dwh}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-airflow:
    image: postgres:15-alpine
    container_name: aurelia-postgres-airflow
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB:-airflow}
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AIRFLOW_USER:-airflow} -d ${POSTGRES_AIRFLOW_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: aurelia-minio
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    container_name: aurelia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_BRONZE:-bronze} local/${MINIO_BUCKET_SILVER:-silver} local/${MINIO_BUCKET_GOLD:-gold} &&
      echo 'MinIO buckets ready';
      "
    restart: "no"

  blacklist-api:
    build:
      context: ./blacklist_api
      dockerfile: Dockerfile
    image: aurelia/blacklist-api:local
    container_name: aurelia-blacklist-api
    ports:
      - "8000:8000"
    environment:
      # File is written by scripts/generate_data.py (first DAG task).
      # Until then, GET /v1/blacklist returns 503.
      BLACKLIST_JSON_PATH: /data/raw/blacklist.json
    volumes:
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    container_name: aurelia-kafka
    environment:
      # KRaft mode (no Zookeeper) — single-node broker + controller.
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: aurelia-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aurelia
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: aurelia-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@aurelia.local || true
    depends_on:
      postgres-airflow:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: aurelia-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      blacklist-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: aurelia-airflow-scheduler
    command: scheduler
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      blacklist-api:
        condition: service_healthy
      postgres-dwh:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-dwh-data:
  postgres-airflow-data:
  minio-data:
  kafka-data:
  spark-checkpoints:
